<body class="bg-slate-50">

<script>

/* =========================================================
   SUPABASE CONFIGURATION
   Replace these two values with your real Supabase project
   ========================================================= */

const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';

const SUPABASE_ENABLED =
!SUPABASE_URL.includes('YOUR_SUPABASE') &&
!SUPABASE_ANON_KEY.includes('YOUR_SUPABASE');

const supabaseClient =
SUPABASE_ENABLED
? supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)
: null;


/* =========================================================
   LOCAL APPLICATION STATE
   ========================================================= */

const STORAGE_KEY="crack_exam_app_v1";

let state=JSON.parse(
localStorage.getItem(STORAGE_KEY)||"null"
)||{

user:null,

page:"dashboard",

dark:false,

result:null,

tests:[

{
id:1,
title:"SSC GD Mock Test 01",
category:"SSC",
questions:[
{
q:"भारत का संविधान कब लागू हुआ?",
options:[
"15 अगस्त 1947",
"26 जनवरी 1950",
"26 नवंबर 1949",
"2 अक्टूबर 1950"
],
answer:1
},
{
q:"15 × 8 = ?",
options:["100","110","120","130"],
answer:2
}
]
},

{
id:2,
title:"Railway Group D Practice",
category:"Railway",
questions:[
{
q:"भारत की राजधानी क्या है?",
options:["मुंबई","नई दिल्ली","कोलकाता","चेन्नई"],
answer:1
},
{
q:"जल का रासायनिक सूत्र क्या है?",
options:["CO2","O2","H2O","NaCl"],
answer:2

]
}

users:[

{
id:1,
name:"CRACK EXAM Admin",
email:"admin@crackexam.com",
role:"Admin"
},

{
id:2,
name:"Demo Student",

role:"Student"
}

],

fees:[

{

}

],

batches:[

{
id:1,
name:"SSC GD 2026",
teacher:"Anil Sir",
students:42
}

]

};


/* =========================================================
   HELPERS
   ========================================================= */

function save(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(state)
);

}

function escapeHTML(value){

return String(value??"")
.replace(/[&<>"']/g,function(m){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m];

});

}

function isAdmin(){

return state.user &&
state.user.role==="Admin";

}

function toast(message){

const box=document.createElement("div");

box.className=
"fixed bottom-5 left-1/2 -translate-x-1/2 z-[9999] bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl";

box.textContent=message;

document.body.appendChild(box);

setTimeout(()=>box.remove(),2200);

}

function icon(name){

return `<i data-lucide="${name}" class="w-5 h-5"></i>`;

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function navigate(page){

const adminPages=[
"admin",
"builder",
"users",
"fees",
"batches"
];

if(adminPages.includes(page) && !isAdmin()){

toast("Admin access required");

return;

}

state.page=page;

save();

render();

}


/* =========================================================
   SIDEBAR
   ========================================================= */

function navButton(page,title,iconName){

return `
<button
onclick="navigate('${page}')"
class="w-full flex items-center gap-3 px-4 py-3 rounded-xl
${state.page===page
?"bg-blue-600 text-white"
:"hover:bg-slate-100 text-slate-700"}">

${icon(iconName)}

<span>${title}</span>

</button>
`;

}

<p class="muted text-slate-500 mt-1">

}

function card(content){

return `

rounded-2xl p-5 shadow-sm">

document.body.appendChild(modal);

}

function authForm(mode){

if(mode==="forgot"){

return `

<h3 class="font-bold text-lg">
Forgot Password
</h3>

<p class="text-sm text-slate-500 mt-1">
Enter your email to reset your password.
</p>

<input
id="authEmail"
type="email"
placeholder="Email"
class="input w-full p-3 bg-slate-100 rounded-xl mt-4">

<button
onclick="forgotPassword()"
class="w-full bg-blue-600 text-white p-3 rounded-xl mt-4 font-bold">
Send Reset Link
</button>

<button
onclick="switchAuth('login')"
class="w-full mt-3 text-blue-600">
Back to Login
</button>

`;

}

const register=mode==="register";

return `

<h3 class="font-bold text-lg">
${register?"Create Account":"Welcome Back"}
</h3>

${
register
?

`<input
id="authName"
placeholder="Full Name"
class="input w-full p-3 bg-slate-100 rounded-xl mt-4">`

:""
}

<input
id="authEmail"
type="email"
placeholder="Email"
class="input w-full p-3 bg-slate-100 rounded-xl mt-3">

<input
id="authPassword"
type="password"
placeholder="Password"
class="input w-full p-3 bg-slate-100 rounded-xl mt-3">

<button
onclick="${register?"registerUser()":"loginUser()"}"
class="w-full bg-blue-600 text-white p-3 rounded-xl mt-4 font-bold">

${register?"Register":"Login"}

</button>

${
!register
?

`<button
onclick="switchAuth('forgot')"
class="w-full text-sm text-blue-600 mt-4">
Forgot Password?
</button>`

:""
}

<button
onclick="switchAuth('${register?"login":"register"}')"
class="w-full mt-4 text-sm text-slate-500">

${register
?"Already have an account? Login"
:"Create a new account"}

</button>

<div class="mt-5 p-3 bg-slate-100 rounded-xl text-xs">

Demo Admin:
admin@crackexam.com / admin123

<br><br>

Demo Student:
student@crackexam.com / student123

</div>

`;

}

function switchAuth(mode){

const body=document.getElementById("authBody");

if(body) body.innerHTML=authForm(mode);

}


/* =========================================================
   AUTHENTICATION
   ========================================================= */

async function loginUser(){

const email=document.getElementById("authEmail").value.trim();

const password=document.getElementById("authPassword").value;

if(!email||!password){

toast("Enter email and password");

return;

}


/* Supabase login */

if(SUPABASE_ENABLED){

const {data,error}=await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){

toast(error.message);

return;

}

const role=
data.user.user_metadata?.role==="Admin"
?"Admin"
:"Student";

state.user={
id:data.user.id,
name:data.user.user_metadata?.full_name||email.split("@")[0],
email,
role
};

save();

document.getElementById("authModal")?.remove();

render();

toast("Login successful");

return;

}


/* Demo/local login */

let user=state.users.find(
u=>u.email.toLowerCase()===email.toLowerCase()
);

if(
email==="admin@crackexam.com" &&
password==="admin123"
){

user=state.users[0];

}

if(
email==="student@crackexam.com" &&
password==="student123"
){

user=state.users[1];

}

if(!user){

toast("Invalid login details");

return;

}

state.user=user;

save();

document.getElementById("authModal")?.remove();

render();

toast("Login successful");

}


async function registerUser(){

const name=document.getElementById("authName").value.trim();

const email=document.getElementById("authEmail").value.trim();

const password=document.getElementById("authPassword").value;

if(!name||!email||!password){

toast("Complete all fields");

return;

}

if(SUPABASE_ENABLED){

const {data,error}=await supabaseClient.auth.signUp({

email,
password,

options:{
data:{
full_name:name,
role:"Student"
}
}

});

if(error){

toast(error.message);

return;

}

toast("Registration successful. Check email if confirmation is enabled.");

return;

}


/* Local demo registration */

if(state.users.some(
u=>u.email.toLowerCase()===email.toLowerCase()
)){

toast("Email already registered");

return;

}

const user={
id:Date.now(),
name,
email,
role:"Student"
};

state.users.push(user);

state.user=user;

save();

document.getElementById("authModal")?.remove();

render();

toast("Account created");

}


async function forgotPassword(){

const email=document.getElementById("authEmail").value.trim();

if(!email){

toast("Enter your email");

return;

}

if(SUPABASE_ENABLED){

const {error}=await supabaseClient.auth.resetPasswordForEmail(
email,
{
redirectTo:window.location.href
}
);

if(error){

toast(error.message);

return;

}

toast("Password reset email sent");

return;

}

toast("Demo mode: reset link simulated");

}


async function logout(){

if(SUPABASE_ENABLED){

await supabaseClient.auth.signOut();

}

state.user=null;

save();

render();

toast("Logged out");

}


/* =========================================================
   TEST ENGINE
   ========================================================= */

function startTest(id){

const test=state.tests.find(t=>t.id===id);

if(!test)return;

let questions=test.questions;

if(!questions.length){

questions=[
{
q:"Demo Question 1",
options:["Option A","Option B","Option C","Option D"],
answer:0
},
{
q:"Demo Question 2",
options:["Option A","Option B","Option C","Option D"],
answer:1
}
];

}

let current=0;

let answers=[];

const modal=document.createElement("div");

modal.className=
"fixed inset-0 z-[300] bg-slate-950/80 p-4 overflow-auto";

modal.innerHTML=`

<div class="max-w-2xl mx-auto
bg-white rounded-2xl p-6 mt-5"
id="testBox">

</div>

`;

document.body.appendChild(modal);


function draw(){

const q=questions[current];

document.getElementById("testBox").innerHTML=`

<div class="flex justify-between">

<div>

<div class="text-sm text-blue-600 font-bold">
${escapeHTML(test.category)}
</div>

<h2 class="font-bold text-xl">
${escapeHTML(test.title)}
</h2>

</div>

<button
onclick="this.closest('.fixed').remove()">
✕
</button>

</div>


<div class="mt-6 text-sm text-slate-500">
Question ${current+1} of ${questions.length}
</div>

<h3 class="text-xl font-bold mt-2">
${escapeHTML(q.q)}
</h3>


<div class="grid gap-3 mt-6">

${q.options.map((option,index)=>`

<button
onclick="answers[${current}]=${index};draw()"
class="p-4 border rounded-xl text-left
${answers[current]===index
?"border-blue-600 bg-blue-50"
:""}">

${String.fromCharCode(65+index)}.
${escapeHTML(option)}

</button>

`).join("")}

</div>


<div class="flex justify-between mt-7">

<button
onclick="current=Math.max(0,current-1);draw()"
class="px-5 py-3 border rounded-xl">
Previous
</button>


${
current===questions.length-1

?

`<button
onclick="finishTest()"
class="px-5 py-3 bg-green-600
text-white rounded-xl font-bold">
Submit Test
</button>`

:

`<button
onclick="current++;draw()"
class="px-5 py-3 bg-blue-600
text-white rounded-xl font-bold">
Next
</button>`

}

</div>

`;

}


function finishTest(){

let correct=0;

questions.forEach((q,index)=>{

if(answers[index]===q.answer){

correct++;

}

});

const score=Math.round(
(correct/questions.length)*100
);

state.result={
title:test.title,
correct,
total:questions.length,
score
};

save();

modal.remove();

navigate("results");

toast("Test submitted successfully");

}

draw();

}


/* =========================================================
   ADMIN ACTIONS
   ========================================================= */

function createTest(event){

event.preventDefault();

const form=new FormData(event.target);

const title=form.get("title");

const category=form.get("category");

const raw=form.get("questions");

const questions=raw
.split("\n")
.map(line=>{

const p=line.split("|");

if(p.length<6)return null;

return {

q:p[0],

options:[
p[1],
p[2],
p[3],
p[4]
],

answer:Number(p[5])-1

};

})
.filter(Boolean);

state.tests.unshift({

id:Date.now(),

title,

category,

questions

});

save();

render();

toast("Test created and published");

}


function deleteTest(id){

if(!confirm("Delete this test?"))return;

state.tests=
state.tests.filter(test=>test.id!==id);

save();

render();

toast("Test deleted");

}


function toggleRole(id){

const user=state.users.find(u=>u.id===id);

if(!user)return;

user.role=
user.role==="Admin"
?"Student"
:"Admin";

save();

render();

toast("Role updated");

}


function toggleFee(id){

const fee=state.fees.find(f=>f.id===id);

if(!fee)return;

fee.status=
fee.status==="Paid"
?"Due"
:"Paid";

save();

render();

}


function createBatch(event){

event.preventDefault();

const form=new FormData(event.target);

state.batches.push({

id:Date.now(),

name:form.get("name"),

teacher:form.get("teacher"),

students:0

});

save();

render();

toast("Batch created");

}


/* =========================================================
   SEARCH
   ========================================================= */

function performSearch(){

const value=
document.getElementById("searchBox")
.value
.toLowerCase()
.trim();

if(!value)return;

if(value.includes("book"))
navigate("books");

else if(
value.includes("practice")||
value.includes("question")
)
navigate("practice");

else if(value.includes("live"))
navigate("live");

else
navigate("exams");

}


/* =========================================================
   UI SETTINGS
   ========================================================= */

function toggleSidebar(){

document
.getElementById("sidebar")
.classList.toggle("-translate-x-full");

}

function toggleDarkMode(){

state.dark=!state.dark;

document.documentElement.classList.toggle(
"dark",
state.dark
);

save();

render();

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

const pages={

dashboard,
exams,
series,
practice,
books,
live,
results,

admin:adminDashboard,

builder,
users,
fees,
batches

};

const pageFunction=
pages[state.page]||dashboard;

document.getElementById("app").innerHTML=
layout(pageFunction());

document.documentElement.classList.toggle(
"dark",
state.dark
);

if(window.lucide){

lucide.createIcons();

}

}


/* =========================================================
   SUPABASE SESSION RESTORE
   ========================================================= */

if(SUPABASE_ENABLED){

supabaseClient.auth.getSession()
.then(({data})=>{

if(data.session){

const user=data.session.user;

state.user={

id:user.id,

name:
user.user_metadata?.full_name||
user.email.split("@")[0],

email:user.email,

role:
user.user_metadata?.role==="Admin"
?"Admin"
:"Student"

};

save();

render();

}

});

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

render();

</script>
