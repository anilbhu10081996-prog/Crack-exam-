<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>CRACK EXAM — Universal Exam Platform</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:12px 14px;box-shadow:0 2px 12px #0002}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:10px}.brand{font-weight:900;font-size:21px;letter-spacing:.5px;margin-right:auto}.brand small{display:block;font-size:9px;color:#a7f3d0;letter-spacing:1.5px}.nav{display:none;gap:6px}.nav button{background:#ffffff16;color:#fff;padding:9px 11px;border-radius:9px}.menu{background:#fff;color:#111827;padding:9px 11px;border-radius:9px}.wrap{max-width:1100px;margin:auto;padding:18px 14px 70px}.hero{background:linear-gradient(135deg,#111827,#243b53);color:#fff;border-radius:20px;padding:25px 20px;margin-bottom:16px}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0 0 18px;color:#dbeafe}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:10px;font-weight:700;background:#e5e7eb;color:#111827}.primary{background:#2563eb;color:white}.green{background:#059669;color:white}.danger{background:#dc2626;color:white}.ghost{background:#fff;border:1px solid #dbe1ea}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:15px;padding:16px;box-shadow:0 3px 12px #1720330a}.card h3{margin:0 0 6px}.muted{color:#64748b;font-size:14px}.pill{display:inline-block;background:#eef2ff;color:#3730a3;padding:4px 8px;border-radius:99px;font-size:12px;margin:3px 3px 3px 0}.section{margin:18px 0}.section h2{font-size:20px;margin:0 0 10px}.hidden{display:none!important}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select{flex:1;min-width:150px}.field{margin-bottom:11px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d5dbe5;border-radius:9px;background:#fff}.field textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}.modalbox{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.modalhead{display:flex;align-items:center;margin-bottom:12px}.modalhead h2{margin:0}.close{margin-left:auto;background:#eef2f7;border-radius:50%;width:34px;height:34px}.qbox{border:1px solid #e2e8f0;border-radius:13px;padding:14px;margin:12px 0;background:#fff}.qhead{display:flex;justify-content:space-between;gap:10px}.option{display:block;border:1px solid #d9e0e9;padding:11px;border-radius:9px;margin:7px 0}.option input{margin-right:8px}.timer{font-size:20px;font-weight:900}.palette{display:flex;flex-wrap:wrap;gap:6px}.palette button{width:36px;height:36px;border-radius:8px;background:#eef2f7}.palette button.answered{background:#bbf7d0}.palette button.review{background:#fde68a}.score{font-size:40px;font-weight:900}.stat{font-size:25px;font-weight:900}.empty{text-align:center;padding:35px;color:#64748b}.adminnav{display:flex;gap:6px;overflow:auto;margin-bottom:14px}.adminnav button{white-space:nowrap;background:#fff;border:1px solid #dce2eb;padding:9px 12px;border-radius:9px}.adminnav button.active{background:#111827;color:#fff}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:10px;z-index:100;display:none}
@media(min-width:800px){.nav{display:flex}.menu{display:none}.modal{align-items:center}.modalbox{border-radius:18px}.wrap{padding-top:25px}}
@media(max-width:600px){.two,.three{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style>
</head>
<body>
<header class="top"><div class="bar">
<div class="brand">CRACK EXAM<small>UNIVERSAL EXAM PLATFORM</small></div>
<nav class="nav">
<button onclick="show('home')">Home</button><button onclick="show('exams')">Exams</button><button onclick="show('tests')">Test Series</button><button onclick="show('results')">My Results</button>
</nav><button class="menu" onclick="openMenu()">☰</button>
</div></header>
<main class="wrap" id="app"></main>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modalbox" id="modalbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='crack_exam_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 exams:[{id:'ex1',name:'RRB Group D 2026',description:'Railway Group D practice and mock tests',subjects:['General Science','Maths','Reasoning']}],
 questions:[
 {id:'q1',exam:'ex1',subject:'General Science',chapter:'Biology',text:'मानव शरीर में रक्त को पंप करने वाला अंग कौन सा है?',options:['फेफड़ा','हृदय','यकृत','गुर्दा'],answer:1,solution:'हृदय एक पेशीय अंग है जो रक्त को पूरे शरीर में पंप करता है।',explanation:'हृदय पूरे शरीर में रक्त संचार बनाए रखने वाला मुख्य पंपिंग अंग है।'}
 ],
 tests:[{id:'t1',name:'RRB Group D Science Test - 01',exam:'ex1',subject:'General Science',duration:30,marks:25,negative:.33,description:'Biology practice test',questions:['q1']}],
 results:[]
};
let state={page:'home',test:null,answers:{},review:{},idx:0,end:0,admin:false};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(p){state.page=p;render()}
function openMenu(){document.getElementById('modalbox').innerHTML=`<div class="modalhead"><h2>Menu</h2><button class="close" onclick="closeModal()">×</button></div>
<div class="grid"><button class="btn" onclick="closeModal();show('home')">🏠 Home</button><button class="btn" onclick="closeModal();show('exams')">🎯 Exams</button><button class="btn" onclick="closeModal();show('tests')">📝 Test Series</button><button class="btn" onclick="closeModal();show('questionbank')">❓ Question Bank</button><button class="btn" onclick="closeModal();show('results')">📊 My Results</button><button class="btn" onclick="closeModal();show('admin')">⚙️ Admin Dashboard</button></div>`;openModal()}
function openModal(){document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function examName(id){return db.exams.find(x=>x.id===id)?.name||'—'}
function render(){let a=document.getElementById('app');if(state.test){renderTest(a);return}
let p=state.page;
if(p==='home')a.innerHTML=home();
else if(p==='exams')a.innerHTML=exams();
else if(p==='tests')a.innerHTML=tests();
else if(p==='questionbank')a.innerHTML=questionbank();
else if(p==='results')a.innerHTML=results();
else if(p==='admin')a.innerHTML=admin();
}
function home(){return `<section class="hero"><h1>Crack Any Exam. Build Your Future.</h1><p>एक Universal Exam Platform — किसी भी परीक्षा के लिए Exam, Test, Question Bank और Result खुद बनाइए।</p><div class="actions"><button class="btn primary" onclick="show('tests')">📝 Start Test</button><button class="btn" onclick="show('exams')">🎯 Explore Exams</button><button class="btn green" onclick="show('admin')">⚙️ Admin</button></div></section>
<div class="section"><h2>Everything in one place</h2><div class="grid">
${[['🎯','Exams','RRB, SSC, UPSC, CTET, Police या कोई भी exam'],['📝','Test Series','Timed test, negative marking और question palette'],['❓','Question Bank','Question को कई tests में reuse करें'],['📖','Solutions','Solution और detailed explanation'],['📊','Results','Score, accuracy और performance analysis'],['🎥','Future Ready','Classes, batches और study material जोड़ने के लिए architecture तैयार']].map(x=>`<div class="card"><div style="font-size:28px">${x[0]}</div><h3>${x[1]}</h3><p class="muted">${x[2]}</p></div>`).join('')}</div></div>
<div class="section"><h2>Popular Tests</h2>${testCards(db.tests.slice(0,4))}</div>`}
function exams(){return `<div class="section"><h2>🎯 Exams</h2><div class="grid">${db.exams.length?db.exams.map(e=>`<div class="card"><span class="pill">ACTIVE</span><h3>${esc(e.name)}</h3><p class="muted">${esc(e.description)}</p><p>${(e.subjects||[]).map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</p><button class="btn primary" onclick="showTestsFor('${e.id}')">View Tests</button></div>`).join(''):'<div class="empty">कोई exam नहीं है। Admin से नया Exam बनाएं।</div>'}</div></div>`}
function showTestsFor(id){state.filter=id;state.page='tests';render()}
function tests(){let list=state.filter?db.tests.filter(t=>t.exam===state.filter):db.tests;return `<div class="section"><div class="toolbar"><h2 style="margin-right:auto">📝 Test Series</h2><input id="search" placeholder="Search test..." oninput="filterTests()"><select onchange="state.filter=this.value||null;render()"><option value="">All Exams</option>${db.exams.map(e=>`<option value="${e.id}" ${state.filter===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div id="testlist">${testCards(list)}</div></div>`}
function filterTests(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('testlist').innerHTML=testCards(db.tests.filter(t=>(!state.filter||t.exam===state.filter)&&t.name.toLowerCase().includes(q)))}
function testCards(list){return list.length?`<div class="grid">${list.map(t=>`<div class="card"><span class="pill">${esc(examName(t.exam))}</span><h3>${esc(t.name)}</h3><p class="muted">${esc(t.description)}</p><div><span class="pill">⏱ ${t.duration} min</span><span class="pill">❓ ${t.questions.length}</span><span class="pill">−${t.negative}</span></div><button class="btn primary" style="margin-top:10px" onclick="startTest('${t.id}')">Start Test →</button></div>`).join('')}</div>`:'<div class="empty">कोई test नहीं मिला।</div>'}
function questionbank(){return `<div class="section"><div class="toolbar"><h2 style="margin-right:auto">❓ Question Bank</h2><input id="qsearch" placeholder="Search question..." oninput="filterQuestions()"></div><div id="qlist">${questionCards(db.questions)}</div></div>`}
function filterQuestions(){let q=document.getElementById('qsearch').value.toLowerCase();document.getElementById('qlist').innerHTML=questionCards(db.questions.filter(x=>(x.text+x.subject+x.chapter).toLowerCase().includes(q)))}
function questionCards(list){return list.length?list.map((q,i)=>`<div class="card"><div class="muted">Question ${i+1} • ${esc(q.subject)} • ${esc(q.chapter)}</div><h3>${esc(q.text)}</h3><div>${q.options.map((o,j)=>`<span class="pill">${String.fromCharCode(65+j)}. ${esc(o)}</span>`).join('')}</div><p><b>Solution:</b> ${esc(q.solution)}</p></div>`).join(''):'<div class="empty">No questions.</div>'}
function results(){return `<div class="section"><h2>📊 My Results</h2>${db.results.length?`<div class="grid">${db.results.slice().reverse().map(r=>`<div class="card"><span class="pill">${esc(r.testName)}</span><div class="stat">${r.score}/${r.total}</div><p>Accuracy: <b>${r.accuracy}%</b></p><p class="muted">${new Date(r.date).toLocaleString('hi-IN')}</p><button class="btn" onclick="viewResult('${r.id}')">View Solutions</button></div>`).join('')}</div>`:'<div class="empty">अभी कोई test attempt नहीं है। पहला test शुरू करें।<br><button class="btn primary" style="margin-top:10px" onclick="show(\\'tests\\')">Start Test</button></div>'}</div>`}
function admin(){return `<div class="section"><div class="hero" style="margin-bottom:12px"><h1>Admin Dashboard</h1><p>Dynamic content management — बिना code बदले Exams, Tests और Questions बनाएं।</p><div class="actions"><button class="btn primary" onclick="newExam()">+ Create Exam</button><button class="btn green" onclick="newTest()">+ Create Test</button><button class="btn" onclick="newQuestion()">+ Add Question</button></div></div>
<div class="adminnav"><button class="active">Overview</button><button onclick="newExam()">🎯 Exams</button><button onclick="newTest()">📝 Test Papers</button><button onclick="show('questionbank')">❓ Question Bank</button></div>
<div class="grid">
<div class="card"><div class="muted">Exams</div><div class="stat">${db.exams.length}</div></div><div class="card"><div class="muted">Test Papers</div><div class="stat">${db.tests.length}</div></div><div class="card"><div class="muted">Questions</div><div class="stat">${db.questions.length}</div></div><div class="card"><div class="muted">Attempts</div><div class="stat">${db.results.length}</div></div>
</div>
<div class="section"><h2>Manage Exams</h2><div class="grid">${db.exams.map(e=>`<div class="card"><h3>${esc(e.name)}</h3><p class="muted">${esc(e.description)}</p><button class="btn" onclick="editExam('${e.id}')">Edit</button> <button class="btn danger" onclick="deleteExam('${e.id}')">Delete</button></div>`).join('')}</div></div>
<div class="section"><h2>Manage Test Papers</h2>${db.tests.map(t=>`<div class="card" style="margin-bottom:8px"><b>${esc(t.name)}</b><span class="pill">${t.questions.length} Questions</span><span class="pill">${t.duration} min</span><button class="btn" style="float:right" onclick="editTest('${t.id}')">Edit</button></div>`).join('')}</div></div>`}
function formModal(title,body){document.getElementById('modalbox').innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${body}`;openModal()}
function newExam(e=null){let x=e||{id:'',name:'',description:'',subjects:[]};formModal(e?'Edit Exam':'Create Exam',`<div class="field"><label>Exam Name *</label><input id="en" value="${esc(x.name)}" placeholder="e.g. SSC GD 2026"></div><div class="field"><label>Description</label><textarea id="ed">${esc(x.description)}</textarea></div><div class="field"><label>Subjects (comma separated)</label><input id="es" value="${esc((x.subjects||[]).join(', '))}" placeholder="Maths, Reasoning, GK"></div><button class="btn primary" onclick="saveExam('${x.id}')">Save Exam</button>`)}
function saveExam(id){let x={id:id||uid('ex'),name:document.getElementById('en').value.trim(),description:document.getElementById('ed').value.trim(),subjects:document.getElementById('es').value.split(',').map(x=>x.trim()).filter(Boolean)};if(!x.name)return toast('Exam name required');let old=db.exams.findIndex(e=>e.id===id);if(old>=0)db.exams[old]=x;else db.exams.push(x);save();closeModal();state.page='admin';render();toast('Exam saved')}
function editExam(id){newExam(db.exams.find(e=>e.id===id))}
function deleteExam(id){if(!confirm('Delete this exam?'))return;db.exams=db.exams.filter(e=>e.id!==id);db.tests=db.tests.filter(t=>t.exam!==id);save();render();toast('Exam deleted')}
function newTest(t=null){let x=t||{id:'',name:'',exam:db.exams[0]?.id||'',subject:'',duration:30,marks:25,negative:.33,description:'',questions:[]};formModal(t?'Edit Test':'Create Test',`<div class="field"><label>Test Name *</label><input id="tn" value="${esc(x.name)}" placeholder="RRB Group D Science Test - 01"></div><div class="two"><div class="field"><label>Exam</label><select id="te">${db.exams.map(e=>`<option value="${e.id}" ${x.exam===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Subject</label><input id="ts" value="${esc(x.subject)}" placeholder="General Science"></div></div><div class="three"><div class="field"><label>Time (minutes)</label><input id="td" type="number" value="${x.duration}"></div><div class="field"><label>Total Marks</label><input id="tm" type="number" value="${x.marks}"></div><div class="field"><label>Negative Marking</label><input id="tneg" type="number" step=".01" value="${x.negative}"></div></div><div class="field"><label>Description</label><textarea id="tx">${esc(x.description)}</textarea></div><div class="field"><label>Select Questions</label><div class="card" style="max-height:240px;overflow:auto">${db.questions.map(q=>`<label class="option"><input type="checkbox" class="tq" value="${q.id}" ${(x.questions||[]).includes(q.id)?'checked':''}> ${esc(q.text)} <span class="pill">${esc(q.subject)}</span></label>`).join('')}</div></div><button class="btn primary" onclick="saveTest('${x.id}')">Save Test Paper</button>`)}
function saveTest(id){let x={id:id||uid('t'),name:document.getElementById('tn').value.trim(),exam:document.getElementById('te').value,subject:document.getElementById('ts').value.trim(),duration:+document.getElementById('td').value||30,marks:+document.getElementById('tm').value||0,negative:+document.getElementById('tneg').value||0,description:document.getElementById('tx').value.trim(),questions:[...document.querySelectorAll('.tq:checked')].map(x=>x.value)};if(!x.name)return toast('Test name required');if(!x.questions.length)return toast('कम से कम 1 question चुनें');let i=db.tests.findIndex(t=>t.id===id);if(i>=0)db.tests[i]=x;else db.tests.push(x);save();closeModal();state.page='admin';render();toast('Test saved')}
function editTest(id){newTest(db.tests.find(t=>t.id===id))}
function newQuestion(q=null){let x=q||{id:'',exam:db.exams[0]?.id||'',subject:'',chapter:'',text:'',options:['','','',''],answer:0,solution:'',explanation:''};formModal(q?'Edit Question':'Add Question',`<div class="two"><div class="field"><label>Exam</label><select id="qe">${db.exams.map(e=>`<option value="${e.id}" ${x.exam===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Subject</label><input id="qs" value="${esc(x.subject)}"></div></div><div class="field"><label>Chapter</label><input id="qc" value="${esc(x.chapter)}"></div><div class="field"><label>Question *</label><textarea id="qt">${esc(x.text)}</textarea></div><div class="two">${[0,1,2,3].map(i=>`<div class="field"><label>Option ${String.fromCharCode(65+i)}</label><input id="qo${i}" value="${esc(x.options[i]||'')}"></div>`).join('')}</div><div class="field"><label>Correct Answer</label><select id="qa">${[0,1,2,3].map(i=>`<option value="${i}" ${x.answer===i?'selected':''}>${String.fromCharCode(65+i)}</option>`).join('')}</select></div><div class="field"><label>Solution</label><textarea id="qsol">${esc(x.solution)}</textarea></div><div class="field"><label>Detailed Explanation</label><textarea id="qex">${esc(x.explanation)}</textarea></div><button class="btn primary" onclick="saveQuestion('${x.id}')">Save Question</button>`)}
function saveQuestion(id){let x={id:id||uid('q'),exam:document.getElementById('qe').value,subject:document.getElementById('qs').value.trim(),chapter:document.getElementById('qc').value.trim(),text:document.getElementById('qt').value.trim(),options:[0,1,2,3].map(i=>document.getElementById('qo'+i).value.trim()),answer:+document.getElementById('qa').value,solution:document.getElementById('qsol').value.trim(),explanation:document.getElementById('qex').value.trim()};if(!x.text||x.options.some(Boolean)===false)return toast('Question and options required');let i=db.questions.findIndex(q=>q.id===id);if(i>=0)db.questions[i]=x;else db.questions.push(x);save();closeModal();state.page='admin';render();toast('Question saved')}
function startTest(id){let t=db.tests.find(x=>x.id===id);if(!t||!t.questions.length)return toast('Test has no questions');state.test=t;state.answers={};state.review={};state.idx=0;state.end=Date.now()+t.duration*60000;render()}
function renderTest(a){let t=state.test,qids=t.questions,q=db.questions.find(x=>x.id===qids[state.idx]);let answered=Object.keys(state.answers).length; a.innerHTML=`<div class="section"><div class="toolbar"><button class="btn ghost" onclick="if(confirm('Exit test?')){state.test=null;show('tests')}">← Exit</button><div class="timer" id="timer">--:--</div><button class="btn danger" style="margin-left:auto" onclick="submitTest()">Submit</button></div>
<div class="card"><div class="muted">${esc(t.name)} • Question ${state.idx+1}/${qids.length}</div><h2>${esc(q.text)}</h2>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="ans" ${state.answers[q.id]===i?'checked':''} onchange="choose(${i})"> <b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')}<div class="actions" style="margin-top:12px"><button class="btn" onclick="prevQ()">← Previous</button><button class="btn" onclick="markReview()">🔖 ${state.review[q.id]?'Unmark':'Mark Review'}</button><button class="btn primary" onclick="nextQ()">Next →</button></div></div>
<div class="card"><b>Question Palette</b><div class="palette" style="margin-top:10px">${qids.map((id,i)=>`<button class="${state.answers[id]!==undefined?'answered':''} ${state.review[id]?'review':''}" onclick="state.idx=${i};render()">${i+1}</button>`).join('')}</div><p class="muted">Answered: ${answered} / ${qids.length}</p></div></div>`;tick()}
function choose(i){let q=db.questions.find(x=>x.id===state.test.questions[state.idx]);state.answers[q.id]=i}
function nextQ(){if(state.idx<state.test.questions.length-1)state.idx++;render()}
function prevQ(){if(state.idx>0)state.idx--;render()}
function markReview(){let q=db.questions.find(x=>x.id===state.test.questions[state.idx]);state.review[q.id]=!state.review[q.id];render()}
let timerHandle;function tick(){clearInterval(timerHandle);timerHandle=setInterval(()=>{if(!state.test)return clearInterval(timerHandle);let s=Math.max(0,Math.ceil((state.end-Date.now())/1000));let el=document.getElementById('timer');if(el)el.textContent=Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0');if(s<=0){clearInterval(timerHandle);submitTest(true)}},500)}
function submitTest(auto=false){if(!auto&&!confirm('Test submit करें?'))return;clearInterval(timerHandle);let t=state.test,total=t.questions.length,correct=0,wrong=0,un=0;let details=[];t.questions.forEach(id=>{let q=db.questions.find(x=>x.id===id),a=state.answers[id];if(a===undefined)un++;else if(a===q.answer)correct++;else wrong++;details.push({qid:id,answer:a})});let score=correct-(wrong*t.negative),accuracy=total?Math.round(correct/total*100):0;let r={id:uid('r'),testId:t.id,testName:t.name,score:Math.max(0,Math.round(score*100)/100),total,correct,wrong,unattempted:un,accuracy,date:new Date().toISOString(),details};db.results.push(r);save();state.test=null;state.page='results';render();setTimeout(()=>viewResult(r.id),50)}
function viewResult(id){let r=db.results.find(x=>x.id===id);if(!r)return;let html=`<div class="modalhead"><h2>📊 ${esc(r.testName)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="grid"><div class="card"><div class="muted">Score</div><div class="score">${r.score}/${r.total}</div></div><div class="card"><div class="muted">Accuracy</div><div class="score">${r.accuracy}%</div></div><div class="card"><div class="muted">Correct / Wrong</div><div class="stat">${r.correct} / ${r.wrong}</div></div></div><div class="section"><h3>Question-wise Solution</h3>${r.details.map((d,i)=>{let q=db.questions.find(x=>x.id===d.qid),a=d.answer;return `<div class="qbox"><b>Q${i+1}. ${esc(q.text)}</b><p>आपका उत्तर: ${a===undefined?'Not Attempted':esc(q.options[a])} ${a===q.answer?'✅':'❌'}</p><p>सही उत्तर: <b>${esc(q.options[q.answer])}</b></p><p><b>समाधान:</b> ${esc(q.solution||'')}</p><p class="muted">${esc(q.explanation||'')}</p></div>`}).join('')}</div>`;document.getElementById('modalbox').innerHTML=html;openModal()}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
render();
</script>
</body>
</html>
