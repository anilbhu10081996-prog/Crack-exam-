<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - CrackExam</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5568d9;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .back {
      text-align: center;
      margin-top: 20px;
    }

    .back a {
      color: #667eea;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🔐 Forgot Password?</h1>

    <p class="subtitle">
      Enter your registered email address and
      we'll send you instructions to reset your password.
    </p>

    <form id="forgotForm">

      <label>Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <button type="submit">
        Send Reset Link
      </button>

    </form>

    <div class="message" id="message"></div>

    <div class="back">
      <a href="login.html">← Back to Login</a>
    </div>

  </div>

  <script>

    const API_URL = "http://localhost:5000/api";

    document
      .getElementById("forgotForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const message =
          document.getElementById("message");

        try {

          const response = await fetch(
            `${API_URL}/auth/forgot-password`,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                email
              })
            }
          );

          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data.message || "Something went wrong"
            );
          }

          message.style.color = "green";

          message.textContent =
            data.message ||
            "Reset instructions have been sent to your email.";

        } catch (error) {

          message.style.color = "red";
          message.textContent = error.message;

        }

      });

  </script>

</body>
</html>
